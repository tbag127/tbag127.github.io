<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Front View -->
  <g transform="translate(50,50)">
    <title>M形下降握点 - 正视图 (M-Shape Descent Hold - Front View)</title>
    <!-- Main M-Shape -->
    <path d="M 0,100 L 60,0 L 90,50 L 120,0 L 180,100" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Depth Profile -->
    <path d="M 0,100 C -10,100 -10,40 0,40 L 60,0 L 90,50 L 120,0 L 180,40 C 190,40 190,100 180,100 Z" 
          fill="none" 
          stroke="black" 
          stroke-width="1"
          stroke-dasharray="4,2"/>
    
    <!-- Mounting Points -->
    <circle cx="30" cy="70" r="3" fill="black"/>
    <circle cx="90" cy="70" r="3" fill="black"/>
    <circle cx="150" cy="70" r="3" fill="black"/>
    
    <!-- Dimensions -->
    <line x1="0" y1="-10" x2="180" y2="-10" stroke="black" stroke-width="1"/>
    <text x="90" y="-20" text-anchor="middle">180mm</text>
  </g>

  <!-- Side View -->
  <g transform="translate(300,50)">
    <title>侧视图 (Side View)</title>
    <!-- Main Profile -->
    <path d="M 0,0 C 20,-10 40,-10 60,0 C 70,20 70,80 60,100 C 40,110 20,110 0,100 C -10,80 -10,20 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Depth Dimension -->
    <line x1="-10" y1="0" x2="-10" y2="60" stroke="black" stroke-width="1"/>
    <text x="-20" y="30" transform="rotate(-90,-20,30)">60mm</text>
  </g>

  <!-- Top View -->
  <g transform="translate(50,250)">
    <title>俯视图 (Top View)</title>
    <!-- Outline -->
    <path d="M 0,0 C 60,10 120,10 180,0 C 190,30 170,60 90,70 C 10,60 -10,30 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Texture Pattern -->
    <path d="M 30,20 L 150,20 M 40,40 L 140,40" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="3,2"/>
  </g>

  <!-- Design Notes -->
  <g transform="translate(300,250)">
    <text x="0" y="0" font-size="12">设计说明 (Design Notes):</text>
    <text x="0" y="20" font-size="12">- 边缘圆滑处理 (15mm半径)</text>
    <text x="0" y="40" font-size="12">- 双重纹理表面</text>
    <text x="0" y="60" font-size="12">- 三点固定系统</text>
    <text x="0" y="80" font-size="12">- M形状适合下降动作</text>
  </g>
</svg>
