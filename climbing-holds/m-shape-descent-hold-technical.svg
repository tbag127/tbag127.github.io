<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Front View -->
  <g transform="translate(50,50)">
    <title>复古电视机下降握点 - 正视图 (Retro TV Descent Hold - Front View)</title>
    <!-- TV Antenna -->
    <path d="M 100,0 L 80,20 M 150,0 L 170,20" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Main TV Shape -->
    <path d="M 0,50 C -20,100 -20,150 0,200 L 250,200 C 270,150 270,100 250,50 Z" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Screen Area (Grip Zone) -->
    <path d="M 25,70 C 15,110 15,140 25,180 L 225,180 C 235,140 235,110 225,70 Z" 
          fill="none" 
          stroke="black" 
          stroke-width="1"
          stroke-dasharray="4,2"/>
    
    <!-- TV Stand -->
    <path d="M 50,200 L 25,220 L 225,220 L 200,200" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Mounting Points -->
    <circle cx="50" cy="90" r="3" fill="black"/>
    <circle cx="200" cy="90" r="3" fill="black"/>
    <circle cx="50" cy="160" r="3" fill="black"/>
    <circle cx="200" cy="160" r="3" fill="black"/>
    <circle cx="125" cy="90" r="3" fill="black"/>
    <circle cx="125" cy="160" r="3" fill="black"/>
    
    <!-- Dimensions -->
    <line x1="0" y1="-10" x2="250" y2="-10" stroke="black" stroke-width="1"/>
    <text x="125" y="-20" text-anchor="middle">250mm</text>
  </g>

  <!-- Side View -->
  <g transform="translate(400,50)">
    <title>侧视图 (Side View)</title>
    <!-- Main Profile -->
    <path d="M 0,0 C 30,-20 60,-20 90,0 C 110,30 110,170 90,200 C 60,220 30,220 0,200 C -20,170 -20,30 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Depth Dimension -->
    <line x1="-10" y1="0" x2="-10" y2="90" stroke="black" stroke-width="1"/>
    <text x="-20" y="45" transform="rotate(-90,-20,45)">90mm</text>
    
    <!-- Screen Depth -->
    <line x1="90" y1="0" x2="90" y2="70" stroke="black" stroke-width="1"/>
    <text x="100" y="35" font-size="10">70mm</text>
  </g>

  <!-- Top View -->
  <g transform="translate(50,300)">
    <title>俯视图 (Top View)</title>
    <!-- Outline -->
    <path d="M 0,0 C 60,-20 190,-20 250,0 C 270,30 270,60 250,90 C 190,110 60,110 0,90 C -20,60 -20,30 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Inner Screen Contours -->
    <path d="M 40,30 C 90,20 160,20 210,30 M 40,45 C 90,35 160,35 210,45 M 40,60 C 90,50 160,50 210,60" 
          stroke="gray" 
          stroke-width="1"/>
  </g>

  <!-- Design Notes -->
  <g transform="translate(400,300)">
    <text x="0" y="0" font-size="12">设计说明 (Design Notes):</text>
    <text x="0" y="20" font-size="12">- 大半径边缘处理 (25mm)</text>
    <text x="0" y="40" font-size="12">- 三层纹理表面处理</text>
    <text x="0" y="60" font-size="12">- 六点固定系统</text>
    <text x="0" y="80" font-size="12">- 复古电视造型带来趣味性</text>
    <text x="0" y="100" font-size="12">- 深度碗状抓握区确保安全</text>
  </g>
</svg>
