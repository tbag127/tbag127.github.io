<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Front View -->
  <g transform="translate(50,50)">
    <title>Front View - M-Shape Descent Hold</title>
    <!-- Main M-Shape Outline -->
    <path d="M 0,0 L 30,80 L 60,0 L 90,80 L 120,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Dimensions -->
    <line x1="0" y1="-10" x2="120" y2="-10" stroke="black" stroke-width="1"/>
    <text x="50" y="-20" text-anchor="middle">140mm</text>
    
    <!-- Height Dimension -->
    <line x1="-10" y1="0" x2="-10" y2="80" stroke="black" stroke-width="1"/>
    <text x="-25" y="40" text-anchor="middle" transform="rotate(-90,-25,40)">80mm</text>
    
    <!-- Valley Depth Markers -->
    <line x1="60" y1="0" x2="60" y2="15" stroke="red" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="70" y="10" font-size="10">15mm</text>
  </g>

  <!-- Side View -->
  <g transform="translate(300,50)">
    <title>Side Profile</title>
    <!-- Main Profile -->
    <path d="M 0,0 C 20,-10 40,-10 45,0 C 50,10 45,80 0,80" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Depth Dimension -->
    <line x1="0" y1="-10" x2="45" y2="-10" stroke="black" stroke-width="1"/>
    <text x="22" y="-20" text-anchor="middle">45mm</text>
    
    <!-- Bolt Hole -->
    <circle cx="20" cy="40" r="5" fill="none" stroke="black"/>
    <text x="35" y="45" font-size="10">3/8" bolt</text>
  </g>

  <!-- Top View -->
  <g transform="translate(50,250)">
    <title>Top View</title>
    <!-- Outline -->
    <path d="M 0,0 C 30,5 60,-5 90,0 C 120,5 140,-5 140,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Texture Pattern Indication -->
    <path d="M 20,0 L 120,0" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="2,2"/>
    <text x="70" y="20" font-size="10" text-anchor="middle">Textured Surface</text>
  </g>

  <!-- Design Notes -->
  <g transform="translate(400,250)">
    <text x="0" y="0" font-size="12">Design Notes:</text>
    <text x="0" y="20" font-size="12">- All edges rounded with 10mm radius</text>
    <text x="0" y="40" font-size="12">- Non-slip texture on grip surface</text>
    <text x="0" y="60" font-size="12">- 15° side wall angle for ergonomic grip</text>
    <text x="0" y="80" font-size="12">- Minimum material thickness: 12mm</text>
    <text x="0" y="100" font-size="12">- UV-resistant polyurethane resin</text>
  </g>
</svg>
