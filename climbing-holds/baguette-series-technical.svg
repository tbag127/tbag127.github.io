<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Baguette Jug -->
  <g transform="translate(50,50)">
    <title>法棍全握点 (Baguette Jug)</title>
    <!-- Main Shape -->
    <path d="M 0,40 C 50,0 250,0 300,40 C 320,60 320,80 300,100 C 250,140 50,140 0,100 C -20,80 -20,60 0,40" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Texture Pattern -->
    <path d="M 50,20 L 250,20 M 50,120 L 250,120" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="5,5"/>
    
    <!-- Dimensions -->
    <line x1="0" y1="-10" x2="300" y2="-10" stroke="black" stroke-width="1"/>
    <text x="150" y="-20" text-anchor="middle">300mm</text>
  </g>

  <!-- Baguette Pinch -->
  <g transform="translate(50,250)">
    <title>法棍中段握点 (Baguette Pinch)</title>
    <!-- Main Shape -->
    <path d="M 0,30 C 25,0 125,0 150,30 C 160,45 160,60 150,70 C 125,100 25,100 0,70 C -10,60 -10,45 0,30" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Pinch Indentations -->
    <path d="M 30,20 C 40,30 110,30 120,20" 
          stroke="black" 
          stroke-width="1" 
          fill="none"/>
  </g>

  <!-- Baguette Slice -->
  <g transform="translate(50,450)">
    <title>法棍切片握点 (Baguette Slice)</title>
    <!-- Main Shape -->
    <ellipse cx="60" cy="60" rx="60" ry="40" 
             fill="none" 
             stroke="black" 
             stroke-width="2"/>
    
    <!-- Internal "Honeycomb" Pattern -->
    <path d="M 30,50 L 90,50 M 40,40 L 80,40 M 40,60 L 80,60" 
          stroke="gray" 
          stroke-width="1"/>
  </g>

  <!-- Mini Baguette -->
  <g transform="translate(250,450)">
    <title>法棍迷你握点 (Mini Baguette)</title>
    <!-- Main Shape -->
    <path d="M 0,15 C 20,0 60,0 80,15 C 85,22 85,28 80,35 C 60,50 20,50 0,35 C -5,28 -5,22 0,15" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
  </g>

  <!-- Baguette End -->
  <g transform="translate(450,450)">
    <title>法棍末端握点 (Baguette End)</title>
    <!-- Main Shape -->
    <path d="M 0,30 C 30,0 70,0 100,30 C 110,40 110,50 100,60 C 70,90 30,90 0,60 C -10,50 -10,40 0,30" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Texture Details -->
    <path d="M 20,25 L 80,25 M 25,45 L 75,45 M 30,65 L 70,65" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="3,3"/>
  </g>

  <!-- Cross Sections -->
  <g transform="translate(600,50)">
    <title>横截面图 (Cross Sections)</title>
    <!-- Various cross-sections showing internal structure and mounting points -->
    <circle cx="50" cy="50" r="5" fill="none" stroke="black"/>
    <text x="65" y="55" font-size="10">3/8" 螺栓孔</text>
  </g>

  <!-- Design Notes -->
  <g transform="translate(600,200)">
    <text x="0" y="0" font-size="12">设计说明 (Design Notes):</text>
    <text x="0" y="20" font-size="12">- 所有边缘圆滑处理 (10mm半径)</text>
    <text x="0" y="40" font-size="12">- 防滑纹理表面</text>
    <text x="0" y="60" font-size="12">- 最小材料厚度: 12mm</text>
    <text x="0" y="80" font-size="12">- UV防护聚氨酯树脂</text>
  </g>
</svg>
