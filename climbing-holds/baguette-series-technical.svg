<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Classic Baguette Hold -->
  <g transform="translate(50,50)">
    <title>经典法棍握点 (Classic Baguette Hold)</title>
    <!-- Main Shape - Long Cylinder -->
    <path d="M 0,20 C 0,10 450,10 450,20 C 450,30 0,30 0,20" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    <!-- Side Profile -->
    <path d="M 460,0 C 470,0 470,40 460,40" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    <!-- Baguette Texture -->
    <path d="M 50,15 L 400,15 M 50,25 L 400,25" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="5,3"/>
    <!-- Mounting Points -->
    <circle cx="100" cy="20" r="2" fill="black"/>
    <circle cx="225" cy="20" r="2" fill="black"/>
    <circle cx="350" cy="20" r="2" fill="black"/>
    <!-- Dimensions -->
    <line x1="0" y1="-10" x2="450" y2="-10" stroke="black" stroke-width="1"/>
    <text x="225" y="-20" text-anchor="middle">450mm</text>
    
    <!-- Texture Pattern -->
    <path d="M 50,20 L 250,20 M 50,120 L 250,120" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="5,5"/>
    
    <!-- Dimensions -->
    <line x1="0" y1="-10" x2="300" y2="-10" stroke="black" stroke-width="1"/>
    <text x="150" y="-20" text-anchor="middle">300mm</text>
  </g>

  <!-- Traverse Baguette Hold -->
  <g transform="translate(50,150)">
    <title>法棍横截握点 (Baguette Traverse Hold)</title>
    <!-- Main Shape -->
    <path d="M 0,20 C 0,10 300,10 300,20 C 300,30 0,30 0,20" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    <!-- Side Profile -->
    <path d="M 310,0 C 320,0 320,35 310,35" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    <!-- Texture -->
    <path d="M 30,15 L 270,15 M 30,25 L 270,25" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="4,2"/>
    
    <!-- Pinch Indentations -->
    <path d="M 30,20 C 40,30 110,30 120,20" 
          stroke="black" 
          stroke-width="1" 
          fill="none"/>
  </g>

  <!-- Diagonal Baguette Hold -->
  <g transform="translate(50,250)">
    <title>法棍斜切握点 (Diagonal Baguette Hold)</title>
    <!-- Main Shape -->
    <path d="M 0,20 L 250,60 L 250,80 L 0,40 Z" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    <!-- Side Profile -->
    <path d="M 260,50 C 270,50 270,85 260,85" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Internal "Honeycomb" Pattern -->
    <path d="M 30,50 L 90,50 M 40,40 L 80,40 M 40,60 L 80,60" 
          stroke="gray" 
          stroke-width="1"/>
  </g>

  <!-- Baguette End Hold -->
  <g transform="translate(50,350)">
    <title>法棍端部握点 (Baguette End Hold)</title>
    <!-- Main Shape - Cross Section -->
    <ellipse cx="40" cy="40" rx="40" ry="35" 
             fill="none" 
             stroke="black" 
             stroke-width="2"/>
    <!-- Internal Texture -->
    <path d="M 15,30 L 65,30 M 15,40 L 65,40 M 15,50 L 65,50" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="3,2"/>
  </g>

  <!-- Baguette End -->
  <g transform="translate(450,450)">
    <title>法棍末端握点 (Baguette End)</title>
    <!-- Main Shape -->
    <path d="M 0,30 C 30,0 70,0 100,30 C 110,40 110,50 100,60 C 70,90 30,90 0,60 C -10,50 -10,40 0,30" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Texture Details -->
    <path d="M 20,25 L 80,25 M 25,45 L 75,45 M 30,65 L 70,65" 
          stroke="gray" 
          stroke-width="1" 
          stroke-dasharray="3,3"/>
  </g>

  <!-- Cross Sections -->
  <g transform="translate(600,50)">
    <title>横截面图 (Cross Sections)</title>
    <!-- Various cross-sections showing internal structure and mounting points -->
    <circle cx="50" cy="50" r="5" fill="none" stroke="black"/>
    <text x="65" y="55" font-size="10">3/8" 螺栓孔</text>
  </g>

  <!-- Design Notes -->
  <g transform="translate(600,200)">
    <text x="0" y="0" font-size="12">设计说明 (Design Notes):</text>
    <text x="0" y="20" font-size="12">- 所有边缘圆滑处理 (10mm半径)</text>
    <text x="0" y="40" font-size="12">- 防滑纹理表面</text>
    <text x="0" y="60" font-size="12">- 最小材料厚度: 12mm</text>
    <text x="0" y="80" font-size="12">- UV防护聚氨酯树脂</text>
  </g>
</svg>
