<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Baguette Jug -->
  <g transform="translate(50,50)">
    <title>法棍主握点 (Main Baguette Jug)</title>
    <!-- Main Shape -->
    <path d="M 0,0 C -20,40 -20,120 0,160 L 280,160 C 300,120 300,40 280,0 Z" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Inner Bowl -->
    <path d="M 20,20 C 10,50 10,110 20,140 L 260,140 C 270,110 270,50 260,20 Z" 
          fill="none" 
          stroke="black" 
          stroke-width="1"
          stroke-dasharray="4,2"/>
    
    <!-- Side View -->
    <g transform="translate(350,0)">
      <path d="M 0,0 C 40,-20 80,-20 110,0 C 130,40 130,120 110,160 C 80,180 40,180 0,160 C -20,120 -20,40 0,0" 
            fill="none" 
            stroke="black" 
            stroke-width="2"/>
    </g>
  </g>

  <!-- Curved Baguette Jug -->
  <g transform="translate(50,250)">
    <title>法棍弧形握点 (Curved Baguette Jug)</title>
    <!-- Main Shape -->
    <path d="M 0,0 C 80,-20 160,-20 240,0 C 260,40 260,100 240,140 C 160,160 80,160 0,140 C -20,100 -20,40 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Inner Bowl -->
    <path d="M 20,20 C 90,5 150,5 220,20 C 235,50 235,90 220,120 C 150,135 90,135 20,120 C 5,90 5,50 20,20" 
          fill="none" 
          stroke="black" 
          stroke-width="1"
          stroke-dasharray="4,2"/>
  </g>

  <!-- Side Baguette Jug -->
  <g transform="translate(50,450)">
    <title>法棍侧握点 (Side Baguette Jug)</title>
    <!-- Main Shape -->
    <path d="M 0,0 C 73,-20 147,-20 220,0 C 240,43 240,87 220,130 C 147,150 73,150 0,130 C -20,87 -20,43 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Finger Slots -->
    <path d="M 40,30 C 60,25 80,25 100,30 M 120,30 C 140,25 160,25 180,30" 
          stroke="gray" 
          stroke-width="1"/>
  </g>

  <!-- Mini Baguette Jug -->
  <g transform="translate(50,650)">
    <title>法棍迷你握点 (Mini Baguette Jug)</title>
    <!-- Main Shape -->
    <path d="M 0,0 C 60,-20 120,-20 180,0 C 200,40 200,80 180,120 C 120,140 60,140 0,120 C -20,80 -20,40 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Inner Bowl -->
    <path d="M 20,20 C 70,5 110,5 160,20 C 175,50 175,70 160,100 C 110,115 70,115 20,100 C 5,70 5,50 20,20" 
          fill="none" 
          stroke="black" 
          stroke-width="1"
          stroke-dasharray="4,2"/>
  </g>

  <!-- Common Features -->
  <g transform="translate(400,800)">
    <text x="0" y="0" font-size="12">共同特性 (Common Features):</text>
    <text x="0" y="20" font-size="12">- 25mm圆滑边缘处理</text>
    <text x="0" y="40" font-size="12">- 光滑无纹理表面</text>
    <text x="0" y="60" font-size="12">- 螺丝固定系统</text>
    <text x="0" y="80" font-size="12">- 2XL-3XL尺寸级别</text>
  </g>
</svg>
