<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Front View -->
  <g transform="translate(50,50)">
    <title>下降握点 - 正视图 (Descent Hold - Front View)</title>
    <!-- Main Bowl Shape -->
    <path d="M 0,150 C -20,100 -20,50 0,0 L 200,0 C 220,50 220,100 200,150 Z" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Inner Bowl Contour -->
    <path d="M 20,130 C 10,90 10,60 20,20 L 180,20 C 190,60 190,90 180,130 Z" 
          fill="none" 
          stroke="black" 
          stroke-width="1"
          stroke-dasharray="4,2"/>
    
    <!-- Lip Detail -->
    <path d="M 0,0 C 50,-20 150,-20 200,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Mounting Points -->
    <circle cx="40" cy="40" r="3" fill="black"/>
    <circle cx="160" cy="40" r="3" fill="black"/>
    <circle cx="40" cy="110" r="3" fill="black"/>
    <circle cx="160" cy="110" r="3" fill="black"/>
    
    <!-- Dimensions -->
    <line x1="0" y1="-10" x2="200" y2="-10" stroke="black" stroke-width="1"/>
    <text x="100" y="-20" text-anchor="middle">200mm</text>
  </g>

  <!-- Side View -->
  <g transform="translate(300,50)">
    <title>侧视图 (Side View)</title>
    <!-- Main Profile -->
    <path d="M 0,0 C 30,-20 60,-20 80,0 C 100,30 100,120 80,150 C 60,170 30,170 0,150 C -20,120 -20,30 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Depth Dimension -->
    <line x1="-10" y1="0" x2="-10" y2="80" stroke="black" stroke-width="1"/>
    <text x="-20" y="40" transform="rotate(-90,-20,40)">80mm</text>
    
    <!-- Lip Overhang -->
    <line x1="80" y1="0" x2="80" y2="35" stroke="black" stroke-width="1"/>
    <text x="90" y="17" font-size="10">35mm</text>
  </g>

  <!-- Top View -->
  <g transform="translate(50,300)">
    <title>俯视图 (Top View)</title>
    <!-- Outline -->
    <path d="M 0,0 C 50,-20 150,-20 200,0 C 220,50 220,100 200,150 C 150,170 50,170 0,150 C -20,100 -20,50 0,0" 
          fill="none" 
          stroke="black" 
          stroke-width="2"/>
    
    <!-- Inner Contours -->
    <path d="M 40,30 C 80,20 120,20 160,30 M 40,60 C 80,50 120,50 160,60 M 40,90 C 80,80 120,80 160,90" 
          stroke="gray" 
          stroke-width="1"/>
  </g>

  <!-- Design Notes -->
  <g transform="translate(300,300)">
    <text x="0" y="0" font-size="12">设计说明 (Design Notes):</text>
    <text x="0" y="20" font-size="12">- 大半径边缘处理 (20mm)</text>
    <text x="0" y="40" font-size="12">- 三层纹理表面处理</text>
    <text x="0" y="60" font-size="12">- 四点固定系统</text>
    <text x="0" y="80" font-size="12">- 碗状设计确保安全下降</text>
  </g>
</svg>
